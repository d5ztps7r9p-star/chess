<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>Analyse d’échecs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1015;--pn:#161922;--pn2:#1d212c;--bd:#272c3a;--tx:#eef0f6;--mu:#8b93a8;--ac:#8493ff;--l:#e7eaf6;--d:#7886c4;
--c0:#3ddbb6;--c1:#6fdc8c;--c2:#b5e26a;--c3:#ffd166;--c4:#ff9f5a;--c5:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(120% 55% at 50% -8%,#1c2245 0,var(--bg) 62%) fixed;color:var(--tx);font:15px/1.45 Manrope,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:auto}
h1{font:800 27px/1.1 Manrope,system-ui,sans-serif;letter-spacing:-.025em;margin:24px 0 16px}
input,button,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
button{cursor:pointer;transition:transform .12s,background .12s}button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{flex:1;min-width:0}
#go{background:var(--ac);border-color:var(--ac);color:#0e1015;font-weight:700}
#msg{color:var(--mu);font-size:13px;min-height:20px;margin:6px 2px}
#list{max-height:38vh;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:18px}
#list:empty{display:none}
.g{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.g:last-child{border:0}.g:active{background:var(--pn2)}.g small{display:block;color:var(--mu);font-size:12px;text-align:right}
.g span:last-child{font-weight:700;text-align:right}.win{color:var(--c1)}.loss{color:var(--c5)}.draw{color:var(--c3)}
#more{background:var(--pn2)}
#an{display:none;margin-top:18px}
#acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
#acc span{display:flex;justify-content:space-between;align-items:baseline;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;color:var(--mu)}
#acc b{font-size:19px;color:var(--tx)}
#bw{display:flex;gap:10px}
#bar{width:10px;border-radius:6px;background:#242836;position:relative;overflow:hidden;flex:none}
#bar i{position:absolute;left:0;right:0;bottom:0;background:#f4f5fa;transition:height .3s}
#bd{flex:1;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 14px 36px #0009}
#bd div{display:flex;align-items:center;justify-content:center;font-size:min(9vw,48px);line-height:1}
.l{background:var(--l)}.d{background:var(--d)}.hl{box-shadow:inset 0 0 0 100px #ffd8664d}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}.b{color:#171a26;filter:drop-shadow(0 1px 0 #fff4)}
#info{margin:12px 0;padding:12px 16px;min-height:62px;background:var(--pn);border:1px solid var(--bd);border-radius:16px}
#info b{font-size:24px;letter-spacing:-.02em}
#nav{display:flex;gap:8px}#nav button{flex:1;font-size:18px;height:48px;padding:0}
svg{width:100%;height:64px;display:block;margin:12px 0;background:var(--pn);border:1px solid var(--bd);border-radius:14px}
#mv{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:24px}
#mv span{padding:5px 10px;border-radius:10px;background:var(--pn2);cursor:pointer;border-left:3px solid var(--bd);font-weight:600}
#mv span.on{outline:2px solid var(--ac)}#mv em{color:var(--mu);font-style:normal;align-self:center;font-size:12px;margin:0 2px 0 6px}
</style></head><body>
<h1>Analyse de parties chess.com</h1>
<div class="row"><input id="u" value="dkyx11" autocapitalize="off" aria-label="Pseudo chess.com"><button id="go">Charger</button></div>
<div class="row"><select id="dp" aria-label="Profondeur d’analyse"><option>12</option><option selected>16</option><option>18</option></select></div>
<div id="msg">Entre ton pseudo puis charge tes parties.</div>
<div id="list"></div><div class="row"><button id="more" style="display:none;width:100%">Charger le mois précédent</button></div>
<div id="an">
<div id="acc"></div>
<div id="bw"><div id="bar"><i></i></div><div id="bd"></div></div>
<div id="info"></div>
<div id="nav"><button data-k="0" aria-label="Début">⏮</button><button data-k="-1" aria-label="Précédent">◀</button><button data-k="1" aria-label="Suivant">▶</button><button data-k="9" aria-label="Fin">⏭</button><button id="flip" aria-label="Retourner">⇅</button></div>
<svg id="gr" viewBox="0 0 300 60" preserveAspectRatio="none"></svg>
<div id="mv"></div></div>
<script>
const $=s=>document.querySelector(s),NAMES=['Meilleur coup','Excellent','Bon','Imprécision','Erreur','Gaffe'],G={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let archives=[],games=[],user='',fens=[],mvs=[],ev=[],best=[],cls=[],acc=[],idx=0,flip=false,tok=0;
const say=t=>$('#msg').textContent=t;
const wp=cp=>50+50*(2/(1+Math.exp(-0.00368208*cp))-1);
async function api(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status===404?'Pseudo introuvable.':'Erreur chess.com ('+r.status+').');return r.json()}
async function more(){
  if(!archives.length)return;const url=archives.pop();say('Chargement…');
  try{const d=await api(url);const g=d.games.filter(x=>x.pgn&&x.rules==='chess').reverse();games.push(...g);showList();
    say(games.length+' parties chargées.')}catch(e){say(e.message)}
  $('#more').style.display=archives.length?'block':'none'}
$('#go').onclick=async()=>{user=$('#u').value.trim().toLowerCase();games=[];$('#list').innerHTML='';
  try{say('Recherche…');archives=(await api(`https://api.chess.com/pub/player/${user}/games/archives`)).archives;await more();if(games.length<15)await more()}
  catch(e){say(e.message+' (si besoin, ouvre la page depuis ton propre hébergement)')}};
$('#more').onclick=more;
function showList(){$('#list').innerHTML='';games.forEach((g,i)=>{
  const me=g.white.username.toLowerCase()===user?g.white:g.black,op=me===g.white?g.black:g.white;
  const r=me.result==='win'?'win':['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'].includes(me.result)?'draw':'loss';
  const d=document.createElement('div');d.className='g';
  d.innerHTML=`<span>${op.username} <small>(${op.rating})</small></span><span class="${r}">${r==='win'?'Gain':r==='draw'?'Nulle':'Perte'} <small>${g.time_class} · ${new Date(g.end_time*1000).toLocaleDateString('fr-FR')}</small></span>`;
  d.onclick=()=>open(g,me===g.black);$('#list').append(d)})}
function open(g,black){
  const c=new Chess();if(!c.load_pgn(g.pgn)){say('PGN illisible.');return}
  mvs=c.history({verbose:true});const h=new Chess();fens=[h.fen()];mvs.forEach(m=>{h.move(m.san);fens.push(h.fen())});
  ev=[];best=[];cls=[];acc=[];idx=0;flip=black;$('#an').style.display='block';draw();$('#an').scrollIntoView();run()}
const cache=new Map();
async function evalFen(fen,depth){
  const c=new Chess(fen);if(c.game_over())return{cp:c.in_checkmate()?(c.turn()==='w'?-1e4:1e4):0,best:''};
  const k=fen+depth;if(cache.has(k))return cache.get(k);
  for(let t=0;t<5;t++){
    try{const r=await fetch('https://chess-api.com/v1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fen,depth,variants:1})});
      if(r.ok){const d=await r.json();
        const cp=d.mate!=null?Math.sign(d.mate)*(1e4-Math.abs(d.mate)):Math.round(+d.centipawns);
        if(!isNaN(cp)){const o={cp,best:d.move||''};cache.set(k,o);return o}}}catch(e){}
    say('Service occupé, nouvel essai…');await new Promise(r=>setTimeout(r,1500*(t+1)))}
  throw new Error('Le service d’analyse ne répond pas. Réessaie dans un moment.')}
async function run(){
  const my=++tok,D=+$('#dp').value;
  try{for(let i=0;i<fens.length;i++){
    const r=await evalFen(fens[i],D);if(my!==tok)return;ev[i]=r.cp;best[i]=r.best;
    if(i>0)classify(i);say(`Analyse ${i}/${fens.length-1}`);draw()}}
  catch(e){say(e.message);return}
  say('Analyse terminée.')}
function classify(i){
  const white=i%2===1,f=cp=>white?wp(cp):100-wp(cp),loss=Math.max(0,f(ev[i-1])-f(ev[i]))/100,m=mvs[i-1];
  const isBest=m.from+m.to+(m.promotion||'')===best[i-1];
  cls[i]=isBest?0:loss<.02?1:loss<.05?2:loss<.1?3:loss<.2?4:5;
  acc[i]=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss*100)-3.1669))}
function sanOf(fen,u){if(!u)return'';const c=new Chess(fen),m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});return m?m.san:''}
function draw(){
  const g=fens[idx].split(' ')[0].split('/').map(r=>[...r].flatMap(ch=>/\d/.test(ch)?Array(+ch).fill(''):[ch])).flat();
  const lm=idx?[mvs[idx-1].from,mvs[idx-1].to]:[],sq=i=>'abcdefgh'[i%8]+(8-(i>>3));
  const order=[...Array(64).keys()];if(flip)order.reverse();
  $('#bd').innerHTML=order.map(i=>{const p=g[i];return`<div class="${((i>>3)+i)%2?'d':'l'} ${lm.includes(sq(i))?'hl':''} ${p?(p===p.toUpperCase()?'w':'b'):''}">${p?G[p.toLowerCase()]:''}</div>`}).join('');
  const e=ev[idx],h=$('#bar i');h.style.height=(e===undefined?50:wp(e))+'%';
  const txt=e===undefined?'…':Math.abs(e)>=9000?'Mat':(e>0?'+':'')+(e/100).toFixed(2);
  const nxt=best[idx]?sanOf(fens[idx],best[idx]):'';
  $('#info').innerHTML=`<b>${txt}</b> ${idx&&cls[idx]!==undefined?`· <span style="color:var(--c${cls[idx]})">${mvs[idx-1].san} : ${NAMES[cls[idx]]}</span>`:''}${nxt?`<br><small style="color:var(--mu)">Meilleur coup ici : ${nxt}</small>`:''}`;
  const side=p=>{const a=acc.filter((x,i)=>x!==undefined&&i%2===p);return a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1)+' %':'–'};
  $('#acc').innerHTML=`<span>Blancs <b>${side(1)}</b></span><span>Noirs <b>${side(0)}</b></span>`;
  $('#mv').innerHTML=mvs.map((m,k)=>{const i=k+1;return`${i%2?`<em>${(i+1)>>1}.</em>`:''}<span data-i="${i}" class="${i===idx?'on':''}" style="border-color:var(--c${cls[i]??9})">${m.san}</span>`}).join('');
  const n=fens.length-1,pts=ev.map((v,i)=>`${i/n*300},${60-wp(v)*.6}`).join(' ');
  $('#gr').innerHTML=`<polyline points="0,60 ${pts} ${(ev.length-1)/n*300},60" fill="#c9d1e6" opacity=".85"/><line x1="${idx/n*300}" x2="${idx/n*300}" y1="0" y2="60" stroke="#e8b04a" stroke-width="2"/>`}
$('#mv').onclick=e=>{if(e.target.dataset.i){idx=+e.target.dataset.i;draw()}};
document.querySelectorAll('#nav [data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;idx=k===0?0:k===9?fens.length-1:Math.max(0,Math.min(fens.length-1,idx+k));draw()});
$('#flip').onclick=()=>{flip=!flip;draw()};
addEventListener('keydown',e=>{const k={ArrowLeft:-1,ArrowRight:1}[e.key];if(k&&fens.length){idx=Math.max(0,Math.min(fens.length-1,idx+k));draw()}});
</script></body></html>
